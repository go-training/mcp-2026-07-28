name: Trivy Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          # Include UNKNOWN so unrated Go advisories are not silently excluded.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          timeout: 5m
          skip-dirs: .git,.cache
